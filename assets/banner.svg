  <text x="64" y="92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#2FA7A0" letter-spacing="1.5">// data analytics &amp; engineering</text>
  <text x="62" y="162" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">Bruno Franco</text>
  <text x="64" y="206" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#E8A33D">Análise e Engenharia de Dados</text>
