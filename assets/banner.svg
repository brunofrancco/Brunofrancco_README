  <text x="772" y="128" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" xml:space="preserve" opacity="0"><tspan fill="#B9C2D0">{</tspan><animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.25s" fill="freeze"/></text><text x="772" y="155" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" xml:space="preserve" opacity="0"><tspan fill="#2FA7A0">  &quot;atuacao&quot;: </tspan><tspan fill="#E8A33D">&quot;Análise + Engenharia&quot;,</tspan><animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.25s" fill="freeze"/></text><text x="772" y="182" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" xml:space="preserve" opacity="0"><tspan fill="#2FA7A0">  &quot;foco&quot;: </tspan><tspan fill="#E8A33D">[&quot;SQL&quot;, &quot;ETL/ELT&quot;, &quot;BI&quot;],</tspan><animate attributeName="opacity" from="0" to="1" begin="1.00s" dur="0.25s" fill="freeze"/></text><text x="772" y="209" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" xml:space="preserve" opacity="0"><tspan fill="#2FA7A0">  &quot;dados&quot;: </tspan><tspan fill="#E8A33D">&quot;validados&quot;,</tspan><animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.25s" fill="freeze"/></text><text x="772" y="236" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" xml:space="preserve" opacity="0"><tspan fill="#2FA7A0">  &quot;status&quot;: </tspan><tspan fill="#E8A33D">&quot;disponível&quot;</tspan><animate attributeName="opacity" from="0" to="1" begin="1.70s" dur="0.25s" fill="freeze"/></text><text x="772" y="263" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" xml:space="preserve" opacity="0"><tspan fill="#B9C2D0">}</tspan><animate attributeName="opacity" from="0" to="1" begin="2.05s" dur="0.25s" fill="freeze"/></text>
  <rect x="790" y="262" width="10" height="19" fill="#E8A33D"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></rect>
