    <radialGradient id="gAmber" cx="88%" cy="85%" r="50%"><stop offset="0" stop-color="#E8A33D" stop-opacity="0.20"/><stop offset="1" stop-color="#E8A33D" stop-opacity="0"/></radialGradient>
    <clipPath id="round"><rect width="1200" height="330" rx="18"/></clipPath>
