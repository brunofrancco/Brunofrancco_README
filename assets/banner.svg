  <text x="64" y="281" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#B9C2D0">e do dado confiável à decisão.</text>
  <rect x="744" y="72" width="392" height="216" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
